name: Build Android APK (Screenloop ATS)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Screenloop ATS Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies & Build Web Assets
        run: |
          npm ci || npm install
          npm run build

      - name: Generate Gradle Wrapper if Missing
        working-directory: ./android
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.2
          fi
          chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Easy Sharing
        working-directory: ./android/app/build/outputs/apk/debug
        run: |
          cp app-debug.apk Screenloop-ATS-Mobile-v1.0.apk
          echo "APK generated successfully at $(pwd)/Screenloop-ATS-Mobile-v1.0.apk"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Screenloop-ATS-Android-APK
          path: android/app/build/outputs/apk/debug/Screenloop-ATS-Mobile-v1.0.apk
          retention-days: 30

      - name: Create GitHub Release with APK Binary
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0-mobile-apk
          name: "Screenloop ATS v1.0.0 Mobile Android App"
          body: |
            ## 📱 Screenloop ATS Mobile Application (.apk)
            
            Download and install the official Screenloop ATS mobile APK on your Android phone!
            
            ### ✨ Included Features:
            - **Candidate Portal**: Browse Pakistani job vacancies, download CV dossiers and Picture CVs.
            - **HR Recruiter ATS**: Hiring pipeline Kanban, applicant scoring, and direct Google Meet video interviews.
            - **Company Workspace**: Enterprise requisitions, benefits overview, and team administration.
            - **Admin Console**: Platform analytics, RBAC governance, and audit trails.
            
            ### 📥 Download:
            Download **`Screenloop-ATS-Mobile-v1.0.apk`** below and tap to install on your Android device.
          files: android/app/build/outputs/apk/debug/Screenloop-ATS-Mobile-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
