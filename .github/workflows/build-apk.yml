name: Build Android APK (Screenloop ATS)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Screenloop ATS Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify Pre-synced Capacitor Assets
        working-directory: ./android/app/src/main/assets/public
        run: |
          ls -la
          test -f index.html && echo "✓ Static index.html is verified pre-synced in Android project"

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle.log || (tail -n 50 gradle.log && exit 1)

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          APK_PATH=$(find android -type f -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" build-output/Screenloop-ATS-Mobile-v1.0.apk
          echo "✓ APK successfully prepared at build-output/Screenloop-ATS-Mobile-v1.0.apk"
          ls -lh build-output/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Screenloop-ATS-Android-APK
          path: build-output/Screenloop-ATS-Mobile-v1.0.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-apk
          name: "Screenloop ATS v1.0.0 Mobile Android App (.APK)"
          body: |
            ## 📱 Screenloop ATS Android Mobile Application
            
            Download and install the official Screenloop ATS mobile APK on your Android phone!
            
            ### ✨ Included Features:
            - **Native Offline Runtime**: Bundles full client application internally via Capacitor.
            - **Candidate Portal**: Browse Pakistani job vacancies, download CV dossiers and Picture CVs.
            - **HR Recruiter ATS**: Hiring pipeline Kanban, applicant scoring, and direct Google Meet video interviews.
            - **Company Workspace**: Enterprise requisitions, benefits overview, and team administration.
            - **Admin Console**: Platform analytics, RBAC governance, and audit trails.
            
            ### 📥 Download APK:
            Download **`Screenloop-ATS-Mobile-v1.0.apk`** below to install on your Android device.
          files: build-output/Screenloop-ATS-Mobile-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
