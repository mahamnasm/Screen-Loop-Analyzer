name: Build Android APK (Screenloop ATS)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Screenloop ATS Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies & Build Web Assets
        run: |
          npm ci || npm install
          npm run build
          npx cap sync android

      - name: Generate Wrapper & Build Debug APK
        working-directory: ./android
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info

      - name: Prepare APK Output
        working-directory: ./android/app/build/outputs/apk/debug
        run: |
          cp app-debug.apk Screenloop-ATS-Mobile-v1.0.apk
          echo "APK generated successfully at $(pwd)/Screenloop-ATS-Mobile-v1.0.apk"
          ls -lh

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Screenloop-ATS-Android-APK
          path: android/app/build/outputs/apk/debug/Screenloop-ATS-Mobile-v1.0.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-apk
          name: "Screenloop ATS v1.0.0 Mobile Android App (.APK)"
          body: |
            ## 📱 Screenloop ATS Android Mobile Application
            
            Download and install the official Screenloop ATS mobile APK on your Android phone!
            
            ### ✨ Included Features:
            - **Candidate Portal**: Browse Pakistani job vacancies, download CV dossiers and Picture CVs.
            - **HR Recruiter ATS**: Hiring pipeline Kanban, applicant scoring, and direct Google Meet video interviews.
            - **Company Workspace**: Enterprise requisitions, benefits overview, and team administration.
            - **Admin Console**: Platform analytics, RBAC governance, and audit trails.
            
            ### 📥 Download APK:
            Download **`Screenloop-ATS-Mobile-v1.0.apk`** below to install on your Android device.
          files: android/app/build/outputs/apk/debug/Screenloop-ATS-Mobile-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
